<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EE305 Project 9 — Transmission Line Transient Voltage</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Project 9: Transmission Line Transient Voltage at Input Terminal</h1>
      <p>DC source <em>V<sub>0</sub></em> with internal resistance <em>R<sub>g</sub></em>, line <em>Z<sub>0</sub> = R<sub>0</sub> + jX<sub>0</sub></em>, length <em>l</em>, velocity <em>u</em>, terminated by <em>L<sub>L</sub></em> or <em>C<sub>L</sub></em></p>
    </div>
  </header>

  <main class="layout">
    <section class="panel inputs-panel">
      <form id="sim-form" novalidate>
        <h2>Input Parameters</h2>

        <div class="field-grid">
          <label for="V0">Source Voltage <em>V<sub>0</sub></em> (V)</label>
          <input id="V0" name="V0" type="text" value="10" required />

          <label for="Rg">Internal Resistance <em>R<sub>g</sub></em> (&Omega;)</label>
          <input id="Rg" name="Rg" type="text" value="75" required />

          <label for="l">Line Length <em>l</em> (m)</label>
          <input id="l" name="l" type="text" value="100" required />

          <label for="u">Wave Velocity <em>u</em> (m/s)</label>
          <input id="u" name="u" type="text" value="2e8" required />

          <label for="R0">Impedance Real Part <em>R<sub>0</sub></em> (&Omega;)</label>
          <input id="R0" name="R0" type="text" value="50" required />

          <label for="X0">Impedance Imag Part <em>X<sub>0</sub></em> (&Omega;)</label>
          <input id="X0" name="X0" type="text" value="0" required />
        </div>

        <h2>Load Termination</h2>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="load_type" value="inductive" checked />
            <span>Inductive Load (<em>L<sub>L</sub></em>)</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="load_type" value="capacitive" />
            <span>Capacitive Load (<em>C<sub>L</sub></em>)</span>
          </label>
        </div>

        <div class="field-grid">
          <label for="LL">Inductance <em>L<sub>L</sub></em> (H)</label>
          <input id="LL" name="LL" type="text" value="25e-6" />

          <label for="CL">Capacitance <em>C<sub>L</sub></em> (F)</label>
          <input id="CL" name="CL" type="text" value="10e-9" disabled />

          <label for="t_max_T">Time Span (multiples of <em>T</em>)</label>
          <input id="t_max_T" name="t_max_T" type="text" value="20" required />
        </div>

        <div id="error-box" class="error-box" hidden></div>

        <div class="actions">
          <button type="submit" class="btn-primary">Plot V(0, t)</button>
          <button type="button" id="download-btn" class="btn-secondary">Save PNG</button>
        </div>
      </form>
    </section>

    <section class="panel plot-panel">
      <div class="metrics-bar">
        <div class="metric"><span>T = l / u</span><strong id="m-T">—</strong></div>
        <div class="metric"><span>|Z<sub>0</sub>|</span><strong id="m-Zeff">—</strong></div>
        <div class="metric"><span>&Gamma;<sub>S</sub></span><strong id="m-GammaS">—</strong></div>
        <div class="metric"><span>V<sub>1</sub><sup>+</sup></span><strong id="m-V1">—</strong></div>
        <div class="metric"><span>&tau;</span><strong id="m-tau">—</strong></div>
        <div class="metric"><span>V(0, &infin;)</span><strong id="m-Vss">—</strong></div>
      </div>

      <div class="canvas-wrap">
        <canvas id="plot-canvas"></canvas>
        <div id="tooltip" class="tooltip" hidden></div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
